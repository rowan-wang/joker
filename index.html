<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balatro React CN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #333;
        /* Fallback to system fonts for Chinese if DotGothic doesn't cover it, aiming for a blocky look */
        font-family: 'DotGothic16', 'Microsoft YaHei', 'SimHei', monospace; 
        overflow: hidden;
      }
      
      /* CRT Scanline & Curvature Effect */
      .crt-container {
        position: relative;
        height: 100vh;
        width: 100vw;
        background-color: #2a2a2a;
        background-image: url('/joker/assets/backgrounds/bg.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      .crt-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 50;
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.97; }
        50% { opacity: 1; }
        100% { opacity: 0.98; }
      }

      /* Floating Card Animation */
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      /* Deal Animation */
      @keyframes dealEnter {
        0% { 
            transform: translate(100vw, 100vh) scale(0.5) rotate(45deg); 
            opacity: 0; 
        }
        70% {
            transform: translate(0, -20px) scale(1.1) rotate(-5deg);
            opacity: 1;
        }
        100% { 
            transform: translate(0, 0) scale(1) rotate(0deg); 
            opacity: 1; 
        }
      }
      .animate-deal {
          animation: dealEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Play Hand Animation (Fly Up) */
      @keyframes playExit {
          0% { transform: translateY(-20px) scale(1.1); opacity: 1; }
          100% { transform: translateY(-200px) scale(0.5) rotate(10deg); opacity: 0; }
      }
      .animate-play {
          animation: playExit 0.6s ease-in forwards;
      }

      /* Scoring Shake */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      .animate-shake {
          animation: shake 0.5s;
          animation-iteration-count: infinite;
      }

      /* Joker Shake (Wobble) */
      @keyframes jokerWobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-8deg); }
        75% { transform: rotate(8deg); }
      }
      .animate-joker-shake {
          animation: jokerWobble 0.3s ease-in-out infinite;
      }

      /* Fire Text Effect */
      .fire-text {
          color: #f59e0b;
          text-shadow: 
              0px -2px 4px #fff, 
              2px -4px 6px #FF3, 
              -2px -6px 10px #F90, 
              0px -10px 20px #C33;
          animation: fire 1s ease-in-out infinite alternate;
      }
      @keyframes fire {
          0% { text-shadow: 0px -2px 4px #fff, 2px -4px 6px #FF3, -2px -6px 10px #F90, 0px -10px 20px #C33; }
          100% { text-shadow: 0px -2px 6px #fff, -2px -4px 10px #FF3, 2px -6px 14px #F90, 0px -12px 24px #C33; transform: scale(1.05); }
      }

      /* Blue Fire Text Effect (High Score) */
      .blue-fire-text {
          color: #60a5fa;
          text-shadow: 
              0px -2px 4px #fff, 
              2px -4px 6px #aaf, 
              -2px -6px 10px #48f, 
              0px -10px 20px #00f;
          animation: blue-fire 1s ease-in-out infinite alternate;
      }
      @keyframes blue-fire {
          0% { text-shadow: 0px -2px 4px #fff, 2px -4px 6px #aaf, -2px -6px 10px #48f, 0px -10px 20px #00f; }
          100% { text-shadow: 0px -2px 6px #fff, -2px -4px 10px #aaf, 2px -6px 14px #48f, 0px -12px 24px #00f; transform: scale(1.1); }
      }

      /* Discard Animation (Fall Down/Shake) */
      @keyframes discardExit {
          0% { transform: translateX(0); }
          10% { transform: translateX(-5px) rotate(-5deg); }
          20% { transform: translateX(5px) rotate(5deg); }
          100% { transform: translateY(200px) rotate(45deg); opacity: 0; }
      }
      .animate-discard {
          animation: discardExit 0.5s ease-in forwards;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #222; 
      }
      ::-webkit-scrollbar-thumb {
        background: #555; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #888; 
      }

      .text-shadow-retro {
        text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
      }
      .text-shadow-red {
         text-shadow: 2px 2px 0px #8b0000;
      }
      .text-shadow-blue {
         text-shadow: 2px 2px 0px #00008b;
      }
    </style>
